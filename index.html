
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAA SHARDA ENTERPRISES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial}
header{text-align:center;background:#050505;padding:18px;border-bottom:2px solid #d4af37}
.logo{width:110px;height:110px;margin:auto;border:2px solid #d4af37;border-radius:50%;overflow:hidden;background:#111}
.logo img{width:100%;height:100%;object-fit:contain}
h1{color:#e5c45b;font-size:22px;margin:10px 0}
.tagline{font-size:12px;color:#ddd}
.banner{text-align:center;padding:18px;background:linear-gradient(120deg,#302000,#111);color:#f5d778;font-weight:bold}
.container{padding:14px}
input,select{width:100%;padding:12px;margin:7px 0;border:1px solid #c9a63b;border-radius:8px;background:#202020;color:white}
#products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}
.card{background:#1b1b1b;border:1px solid #9e802c;border-radius:12px;padding:10px;text-align:center}
.card img{width:100%;height:115px;object-fit:contain;background:white;border-radius:8px}
.card h3{color:#f1d16b;font-size:15px;min-height:34px}
.price{font-size:13px;line-height:1.8}
.rate{color:#f5d36b;font-size:17px;font-weight:bold}
.stock{color:#9be39b;font-size:12px}
.qty{width:75px;text-align:center}
.order{width:100%;background:#d4af37;color:#111;border:0;padding:10px;border-radius:7px;font-weight:bold;margin-top:8px}
.empty{grid-column:1/-1;text-align:center;padding:25px}
footer{text-align:center;padding:20px;color:#d4af37;font-size:12px}
</style>
</head>
<body>

<header>
<div class="logo">
<img src="file_00000000445c8211b245621e12e06bc3.png" alt="MSE Maa Durga Logo">
</div>
<h1>MAA SHARDA ENTERPRISES</h1>
<div class="tagline">A WHOLESALE DEALER OF GENERIC & OTC PRODUCTS</div>
</header>

<div class="banner">PREMIUM PRODUCTS • BEST DEALS</div>

<div class="container">
<input id="search" placeholder="Search products..." oninput="showProducts()">

<select id="category" onchange="showProducts()">
<option value="all">All Categories</option>
<option value="generic">Generic</option>
<option value="otc">OTC</option>
</select>

<div id="products"><div class="empty">Loading Products...</div></div>
</div>

<footer>
MAA SHARDA ENTERPRISES<br>
Quality Products • Trusted Service<br>
Order on WhatsApp
</footer>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbw4oqWdtMt_55ojyq1qhMY96qdXXmzZGcWTT5k8wv83PeWqQN8_R-_8ut4GTUsD61XD6w/exec";
const WHATSAPP_NUMBER="917908806161";
let allProducts=[];

function val(p,keys){
 for(const k of keys){
  if(p[k]!==undefined && p[k]!==null)return p[k];
 }
 return "";
}

async function loadProducts(){
 const box=document.getElementById("products");
 try{
  const res=await fetch(API_URL);
  const data=await res.json();
  allProducts=Array.isArray(data)?data:(data.products||data.data||[]);
  showProducts();
 }catch(e){
  box.innerHTML='<div class="empty">Products load হচ্ছে না। পরে আবার চেষ্টা করুন।</div>';
 }
}

function showProducts(){
 const box=document.getElementById("products");
 const search=document.getElementById("search").value.toLowerCase();
 const category=document.getElementById("category").value;
 box.innerHTML="";

 const filtered=allProducts.filter(p=>{
  const name=String(val(p,["name","product name","productName"])).toLowerCase();
  const cat=String(val(p,["category","catagory","Category"])).toLowerCase();
  return name.includes(search)&&(category==="all"||cat===category);
 });

 if(!filtered.length){
  box.innerHTML='<div class="empty">No products found</div>';
  return;
 }

 filtered.forEach(p=>{
  const name=val(p,["name","product name","productName"]);
  const mrp=val(p,["mrp","MRP"]);
  const rate=val(p,["netRate","net rate","net_rate","Net Rate"]);
  const stock=val(p,["stock","Stock"]);
  const photo=val(p,["photo","photoURL","photoUrl","image","photo URL"]);

  const card=document.createElement("div");
  card.className="card";

  if(photo){
   const img=document.createElement("img");
   img.src=photo;
   img.alt=name;
   img.onerror=()=>img.style.display="none";
   card.appendChild(img);
  }

  const title=document.createElement("h3");
  title.textContent=name;
  card.appendChild(title);

  const price=document.createElement("div");
  price.className="price";
  price.innerHTML='<div>MRP: ₹'+mrp+'</div><div class="rate">Net Rate: ₹'+rate+'</div><div class="stock">Stock: '+stock+'</div>';
  card.appendChild(price);

  const qty=document.createElement("input");
  qty.className="qty";
  qty.type="number";
  qty.min="1";
  qty.value="1";
  card.appendChild(qty);

  const btn=document.createElement("button");
  btn.className="order";
  btn.textContent="ORDER ON WHATSAPP";
  btn.onclick=()=>placeOrder(name,mrp,rate,qty.value);
  card.appendChild(btn);

  box.appendChild(card);
 });
}

function placeOrder(name,mrp,rate,quantity){
 quantity=Number(quantity);
 if(!Number.isInteger(quantity)||quantity<1){
  alert("Please enter valid quantity");
  return;
 }

 const customer=prompt("Enter your name:");
 if(!customer)return;
 const mobile=prompt("Enter your mobile number:");
 if(!mobile)return;
 const address=prompt("Enter your delivery address:");
 if(!address)return;

 const total=Number(rate)*quantity;
 const message=
 "MAA SHARDA ENTERPRISES - NEW ORDER\n\n"+
 "Customer: "+customer+"\n"+
 "Mobile: "+mobile+"\n"+
 "Address: "+address+"\n\n"+
 "Product: "+name+"\n"+
 "MRP: Rs. "+mrp+"\n"+
 "Net Rate: Rs. "+rate+"\n"+
 "Quantity: "+quantity+"\n"+
 "Total: Rs. "+total;

 window.open("https://wa.me/"+WHATSAPP_NUMBER+"?text="+encodeURIComponent(message),"_blank");
}
loadProducts();
</script>
</body>
</html>
