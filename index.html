<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAA SHARDA ENTERPRISES</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f4f6;font-family:Arial;color:#222}
header{background:linear-gradient(135deg,#172554,#7c2d12);color:white;text-align:center;padding:25px 12px}
header h1{font-size:23px;margin:8px 0}
header p{font-size:12px}
.search{padding:15px}
input{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
h2{padding:0 15px}
#products{padding:12px;display:grid;gap:12px}
.product{background:white;padding:16px;border-radius:12px;box-shadow:0 2px 8px #ddd}
.product h3{margin:0 0 10px;color:#172554}
.price{color:#168b48;font-weight:bold;font-size:19px}
.mrp{color:#666;font-size:14px}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>MAA SHARDA ENTERPRISES</h1>
<p>A WHOLESALE DEALER OF GENERIC & OTC PRODUCTS</p>
</header>
<div class="search">
<input id="search" placeholder="Search products..." oninput="showProducts()">
</div>
<h2>Our Products</h2>
<div id="products">Loading products...</div>
<footer>MAA SHARDA ENTERPRISES</footer>
<script>
const API="https://script.google.com/macros/s/AKfycbw4oqWdtMt_55ojyq1qhMY96qdXXmzZGcWTT5k8wv83PeWqQN8_R-_8ut4GTUsD61XD6w/exec";
let products=[];
async function loadProducts(){
try{
const response=await fetch(API);
products=await response.json();
showProducts();
}catch(error){
document.getElementById("products").innerHTML="Products could not load. Please try again.";
}
}

function showProducts(){
const term=document.getElementById("search").value.toLowerCase();
const filtered=products.filter(p=>(p.name||"").toLowerCase().includes(term));

document.getElementById("products").innerHTML=filtered.length?
filtered.map(p=>`
<div class="product">
<h3>${p.name}</h3>
<div class="mrp">MRP: ₹${p.mrp}</div>
<div class="price">Net Rate: ₹${p.netRate}</div>
<p>Stock: ${p.stock||"Not updated"}</p>
<p>Category: ${p.category||"Other"}</p>
<a href="https://wa.me/917908806161?text=${encodeURIComponent("Hello Maa Sharda Enterprises, I want to order: "+p.name+". Net Rate: Rs. "+p.netRate)}" style="display:block;background:#168b48;color:white;padding:12px;text-align:center;border-radius:8px;text-decoration:none;font-weight:bold">
ORDER ON WHATSAPP
</a>
</div>`).join(""):"No products found.";
}

loadProducts();
</script>
</body>
</html>
